name: Publish extension

# Version for stores comes from the release tag (e.g. v0.8.0 → 0.8.0), not from package.json on the branch.
# package.json is updated only inside the job before pack/publish; commit bumps on main separately if you want them in sync.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (e.g. 0.8.0). Leave empty to use package.json as-is."
        required: false
        type: string

concurrency:
  group: publish-vscode-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "Using version $VERSION from tag $TAG"
          npm pkg set "version=$VERSION"

      - name: Set version from workflow input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          echo "Using version ${{ inputs.version }} from workflow input"
          npm pkg set "version=${{ inputs.version }}"

      - name: Show published semver
        run: node -p "require('./package.json').version"

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --no-git-tag-version -o extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath extension.vsix

      - name: Publish to Open VSX Registry
        run: npx --yes ovsx publish extension.vsix -p "$OVSX_PAT"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: extension.vsix
