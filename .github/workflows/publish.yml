name: Publish extension

# Manual only: bump semver (major/minor/patch) from package.json, publish to stores, then create a GitHub Release with VSIX + generated notes.
# fetch-depth: 0 helps gh release --generate-notes compare against prior releases.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump applied to version in package.json before build/publish"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-vscode-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump semver from package.json
        run: |
          echo "Bumping ${{ inputs.bump }} from $(node -p "require('./package.json').version")"
          npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Show published semver
        run: node -p "require('./package.json').version"

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --no-git-tag-version -o extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath extension.vsix

      - name: Publish to Open VSX Registry
        run: npx --yes ovsx publish extension.vsix -p "$OVSX_PAT"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: extension.vsix

      # Remove an existing release for this tag first so `gh release create` always runs; the git tag is unchanged.
      - name: Create GitHub release with VSIX and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          ASSET="sfx-toolkit-${VERSION}.vsix"
          cp extension.vsix "$ASSET"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" "$ASSET" \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}"
