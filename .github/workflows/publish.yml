name: Publish extension

# Manual only: bump semver (major/minor/patch) from package.json, publish to stores, then create a GitHub Release with VSIX + generated notes.
# fetch-depth: 0 helps gh release --generate-notes compare against prior releases.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump applied to version in package.json before build/publish"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-vscode-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Use github.event.inputs for workflow_dispatch (inputs.* can be empty on some runners).
      # Compute next version explicitly so logs show current → next and semver rules are consistent.
      - name: Bump semver from package.json
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          if [ -z "${BUMP:-}" ]; then
            echo "ERROR: bump input is empty (expected patch | minor | major)."
            exit 1
          fi
          NEXT=$(npx --yes semver@7 "$CURRENT" -i "$BUMP")
          echo "Bumping $BUMP: $CURRENT → $NEXT"
          npm version "$NEXT" --no-git-tag-version

      - name: Show published semver
        run: node -p "require('./package.json').version"

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --no-git-tag-version -o extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath extension.vsix

      - name: Publish to Open VSX Registry
        run: npx --yes ovsx publish extension.vsix -p "$OVSX_PAT"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: extension.vsix

      # Remove an existing release for this tag first so `gh release create` always runs; the git tag is unchanged.
      - name: Create GitHub release with VSIX and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          ASSET="sfx-toolkit-${VERSION}.vsix"
          cp extension.vsix "$ASSET"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" "$ASSET" \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Commit and Push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Get the new version for the commit message
          NEW_VERSION=$(node -p "require('./package.json').version")

          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
